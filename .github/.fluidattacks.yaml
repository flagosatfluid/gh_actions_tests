language: EN
output:
  file_path: fluidattacks-results.sarif
  format: SARIF
ss:
  include:
    - .
  exclude:
    - environment/backend/
sca:
  include:
    - .
sast:
  include:
    - .
apk:
  include:
    - glob(**.apk)
  use_sast_analysis: False
dast:
  strict_connectivity: True
  urls:
    - url: https://www.fluidattacks.com
    - url: https://www.google.com