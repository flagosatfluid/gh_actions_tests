name: Security Scans
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  secret-scan-full:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: fluidattacks/ss-action@flagos
        id: scan
        with:
          scan_config_path: .github/.fluidattacks.yaml
          group: machinetest

      - name: Show outputs
        run: |
          echo "skip=${{ steps.scan.outputs.skip }}"
          echo "vulnerabilities_found=${{ steps.scan.outputs.vulnerabilities_found }}"
          echo "sarif_file=${{ steps.scan.outputs.sarif_file }}"
          test -f "${{ steps.scan.outputs.sarif_file }}"

      - name: Fail if vulnerabilities found
        if: steps.scan.outputs.vulnerabilities_found == 'true'
        run: exit 1

  secret-scan-diff:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: fluidattacks/ss-action@flagos
        id: scan
        with:
          scan_config_path: .github/.fluidattacks.yaml
          scanner_mode: diff
          group: machinetest

      - name: Show outputs
        run: |
          echo "skip=${{ steps.scan.outputs.skip }}"
          echo "vulnerabilities_found=${{ steps.scan.outputs.vulnerabilities_found }}"

      - name: Fail if vulnerabilities found
        if: steps.scan.outputs.vulnerabilities_found == 'true'
        run: exit 1

  secret-scan-no-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: fluidattacks/ss-action@flagos
        id: scan
        with:
          strict: true

      - name: Show outputs
        if: always()
        run: |
          echo "sarif_file=${{ steps.scan.outputs.sarif_file }}"
          test -f "${{ steps.scan.outputs.sarif_file }}"

      - name: Fail if vulnerabilities found
        if: steps.scan.outputs.vulnerabilities_found == 'true'
        run: exit 1
